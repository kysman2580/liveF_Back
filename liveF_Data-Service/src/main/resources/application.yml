spring:
  application:
    name: data
  profiles:
    active: dev
  config:
    import: optional:configserver:http://admin:1234@localhost:9000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  data:
    redis:
      host: localhost
      port: 6379

